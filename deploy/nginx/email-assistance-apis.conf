# Email Assistance — Backend API
# Dominios necesarios: 2 (app + apis). Postgres no publica dominio.
#
# Cuando tengas DNS, apunta el A record a este servidor y luego:
#   sudo certbot --nginx -d email-assistance-apis.xiarex.io
#
# En Google Cloud OAuth agrega:
#   https://email-assistance-apis.xiarex.io/google/oauth/callback

server {
    listen 80;
    server_name email-assistance-apis.xiarex.io;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/email_assistance_apis_access.log;
    error_log  /var/log/nginx/email_assistance_apis_error.log;
}
