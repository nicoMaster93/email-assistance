# Email Assistance — Frontend
# Dominios necesarios: 2 (app + apis). Postgres no publica dominio.
#
# Cuando tengas DNS, apunta el A record a este servidor y luego:
#   sudo certbot --nginx -d email-assistance.xiarex.io
#
# Si usas otro dominio, cambia server_name aquí y en sites-enabled.

server {
    listen 80;
    server_name email-assistance.xiarex.io;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/email_assistance_app_access.log;
    error_log  /var/log/nginx/email_assistance_app_error.log;
}
